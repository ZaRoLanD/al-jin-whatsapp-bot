<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-labelledby="t d">
<title id="t">Al-Jin WhatsApp Bot — by Malik Mehab</title>
<desc id="d">Al-Jin: self-hosted, open-source WhatsApp Multi-Device bot built on Node.js and Baileys v7, with free AI and ~400 commands. By Malik Mehab.</desc>

<defs>
  <!-- ── Background Gradients ─────────────────────────── -->
  <linearGradient id="bgGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="320">
    <stop offset="0"   stop-color="#050914"/>
    <stop offset=".4"  stop-color="#0a1030"/>
    <stop offset=".7"  stop-color="#0d1b3e"/>
    <stop offset="1"   stop-color="#061c2e"/>
  </linearGradient>

  <!-- ── Text Gradients ───────────────────────────────── -->
  <linearGradient id="titleGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0" spreadMethod="repeat">
    <stop offset="0"   stop-color="#22d3ee"/>
    <stop offset=".25" stop-color="#818cf8"/>
    <stop offset=".5"  stop-color="#c084fc"/>
    <stop offset=".75" stop-color="#34d399"/>
    <stop offset="1"   stop-color="#22d3ee"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="600 0" dur="8s" repeatCount="indefinite"/>
  </linearGradient>

  <linearGradient id="shineGrad" gradientUnits="userSpaceOnUse" x1="-200" y1="0" x2="200" y2="0">
    <stop offset="0"   stop-color="#ffffff" stop-opacity="0"/>
    <stop offset=".5"  stop-color="#ffffff" stop-opacity=".95"/>
    <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-200 0;1100 0;1100 0" keyTimes="0;0.4;1" dur="6s" repeatCount="indefinite"/>
  </linearGradient>

  <!-- ── Smoke Gradients ──────────────────────────────── -->
  <linearGradient id="smokeGold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fde68a" stop-opacity=".9"/>
    <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="smokeCyan" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#a5f3fc" stop-opacity=".8"/>
    <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
  </linearGradient>

  <!-- ── Aurora Blobs ─────────────────────────────────── -->
  <radialGradient id="aurora1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".5"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <radialGradient id="aurora2"><stop offset="0" stop-color="#a855f7" stop-opacity=".45"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
  <radialGradient id="aurora3"><stop offset="0" stop-color="#f59e0b" stop-opacity=".35"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>

  <!-- ── Badge Glows ──────────────────────────────────── -->
  <radialGradient id="waGlow"><stop offset="0" stop-color="#22c55e" stop-opacity=".6"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/></radialGradient>
  <radialGradient id="lampGlow"><stop offset="0" stop-color="#fbbf24" stop-opacity=".7"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>

  <!-- ── Vignette & Glass ─────────────────────────────── -->
  <radialGradient id="vignette" cx="450" cy="160" r="500">
    <stop offset=".6" stop-color="#000" stop-opacity="0"/>
    <stop offset="1"   stop-color="#000" stop-opacity=".65"/>
  </radialGradient>
  <linearGradient id="glassTop" x1="0" y1="0" x2="0" y2="100">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".08"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>

  <!-- ── Patterns & Filters ───────────────────────────── -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#7dd3fc" stroke-opacity=".05" stroke-width="1"/>
  </pattern>

  <filter id="glowBlur" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="smokeBlur" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
  <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <clipPath id="clipBanner"><rect x="2" y="2" width="896" height="316" rx="24"/></clipPath>
</defs>

<g clip-path="url(#clipBanner)">

  <!-- ══════════ BACKGROUND ══════════ -->
  <rect width="900" height="320" fill="url(#bgGrad)"/>
  <rect width="900" height="320" fill="url(#grid)"/>

  <!-- ══════════ AURORA BLOBS ══════════ -->
  <ellipse cx="120" cy="40" rx="280" ry="180" fill="url(#aurora1)">
    <animate attributeName="cx" values="120;180;120" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="40;20;40" dur="14s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="780" cy="280" rx="300" ry="190" fill="url(#aurora2)">
    <animate attributeName="cx" values="780;700;780" dur="15s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="280;310;280" dur="11s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="450" cy="320" rx="350" ry="120" fill="url(#aurora3)">
    <animate attributeName="cy" values="320;290;320" dur="9s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ══════════ STARFIELD & PARTICLES ══════════ -->
  <g fill="#cfe9ff">
    <circle cx="150" cy="50" r="1.5"><animate attributeName="opacity" values=".1;.9;.1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="120" r="1"><animate attributeName="opacity" values=".1;.9;.1" dur="5s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="40" r="2"><animate attributeName="opacity" values=".1;.9;.1" dur="3.5s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="750" cy="90" r="1.2"><animate attributeName="opacity" values=".1;.9;.1" dur="6s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="200" r="1.5"><animate attributeName="opacity" values=".1;.9;.1" dur="4.5s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="280" r="1"><animate attributeName="opacity" values=".1;.9;.1" dur="5.5s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="260" r="1.8"><animate attributeName="opacity" values=".1;.9;.1" dur="4.2s" begin="0.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ══════════ THICK SWIRLING SMOKE (BACKGROUND LAYER) ══════════ -->
  <g filter="url(#smokeBlur)">
    <!-- Smoke wrapping around WhatsApp Logo -->
    <path d="M 40 120 C -10 160, 80 220, 150 180 C 220 140, 180 80, 120 60 C 60 40, 20 100, 60 150" 
          fill="none" stroke="url(#smokeCyan)" stroke-width="12" stroke-linecap="round">
      <animate attributeName="stroke-opacity" values=".2;.6;.2" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dashoffset" values="0;-100" dur="8s" repeatCount="indefinite" stroke-dasharray="30 40"/>
    </path>
    <!-- Smoke rising from Lamp -->
    <path d="M 820 200 C 780 160, 860 100, 800 40 C 760 -10, 840 -40, 780 -80" 
          fill="none" stroke="url(#smokeGold)" stroke-width="14" stroke-linecap="round">
      <animate attributeName="stroke-opacity" values=".2;.7;.2" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dashoffset" values="0;-80" dur="6s" repeatCount="indefinite" stroke-dasharray="40 50"/>
    </path>
    <!-- Connecting smoke across the banner -->
    <path d="M 150 250 C 300 300, 600 280, 750 230" 
          fill="none" stroke="url(#smokeCyan)" stroke-width="8" stroke-linecap="round">
      <animate attributeName="stroke-opacity" values=".1;.4;.1" dur="7s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dashoffset" values="0;-60" dur="7s" begin="2s" repeatCount="indefinite" stroke-dasharray="20 30"/>
    </path>
  </g>

  <!-- ══════════ MAJESTIC JINN (RIGHT SIDE) ══════════ -->
  <g>
    <!-- Jinn Aura -->
    <circle cx="760" cy="120" r="80" fill="url(#lampGlow)" opacity=".6">
      <animate attributeName="r" values="80;100;80" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".4;.7;.4" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- Jinn Body (Ethereal Swirl) -->
    <path d="M 760 160 C 720 140, 700 100, 720 60 C 740 20, 780 20, 800 60 C 820 100, 800 140, 760 160 Z" 
          fill="url(#smokeCyan)" filter="url(#glowBlur)" opacity=".8">
      <animate attributeName="opacity" values=".6;.9;.6" dur="4s" repeatCount="indefinite"/>
    </path>
    
    <!-- Jinn Torso & Arms -->
    <path d="M 730 80 Q 760 110 790 80" fill="none" stroke="#67e8f9" stroke-width="6" stroke-linecap="round" filter="url(#smokeBlur)"/>
    <path d="M 740 90 Q 760 120 780 90" fill="none" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" filter="url(#smokeBlur)"/>

    <!-- Jinn Head -->
    <circle cx="760" cy="45" r="18" fill="#a5f3fc" filter="url(#smokeBlur)"/>
    <circle cx="760" cy="45" r="14" fill="#e0f7ff"/>

    <!-- Jinn Turban -->
    <path d="M 740 35 Q 760 15 780 35 Q 760 25 740 35" fill="#fbbf24"/>
    <path d="M 735 40 Q 760 50 785 40" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="760" cy="18" r="4" fill="#fde68a"/>

    <!-- Jinn Face (Eyes & Beard) -->
    <circle cx="754" cy="45" r="2.5" fill="#0f172a"/>
    <circle cx="766" cy="45" r="2.5" fill="#0f172a"/>
    <path d="M 752 52 Q 760 58 768 52" fill="none" stroke="#0f172a" stroke-width="2"/>
    <path d="M 750 52 Q 760 65 770 52 Q 760 60 750 52" fill="#64748b" filter="url(#smokeBlur)"/>

    <!-- Jinn Tail connecting to Lamp -->
    <path d="M 760 160 C 780 190, 800 220, 820 240" 
          fill="none" stroke="url(#smokeGold)" stroke-width="10" stroke-linecap="round" filter="url(#smokeBlur)">
      <animate attributeName="stroke-opacity" values=".4;.9;.4" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ══════════ MAGIC LAMP (BOTTOM RIGHT) ══════════ -->
  <g transform="translate(790 230) scale(1.1)">
    <!-- Lamp Glow -->
    <ellipse cx="30" cy="20" rx="40" ry="30" fill="url(#lampGlow)" opacity=".5">
      <animate attributeName="opacity" values=".3;.7;.3" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Spout -->
    <path d="M 0 20 L 15 15 L 13 28 Z" fill="#fbbf24"/>
    <!-- Body -->
    <path d="M 15 15 Q 10 35 25 40 L 45 40 Q 60 35 55 15 Q 50 5 35 5 Q 20 5 15 15 Z" fill="#f59e0b"/>
    <!-- Handle -->
    <path d="M 55 15 Q 70 10 70 25 Q 70 38 58 35" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
    <!-- Lid -->
    <rect x="28" y="0" width="14" height="7" rx="3" fill="#fbbf24"/>
    <!-- Finial -->
    <circle cx="35" cy="-4" r="4" fill="#fde68a"/>
    <!-- Shine -->
    <path d="M 20 10 Q 35 5 45 10" fill="none" stroke="#ffffff" stroke-width="2" opacity=".5"/>
  </g>

  <!-- ══════════ WHATSAPP BADGE (LEFT SIDE) ══════════ -->
  <g>
    <!-- Glow -->
    <circle cx="120" cy="160" r="70" fill="url(#waGlow)">
      <animate attributeName="r" values="65;75;65" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".6;1;.6" dur="5s" repeatCount="indefinite"/>
    </circle>
    <!-- Rotating Ring -->
    <circle cx="120" cy="160" r="52" fill="none" stroke="#4ade80" stroke-opacity=".4" stroke-width="1.5" stroke-dasharray="5 10">
      <animateTransform attributeName="transform" type="rotate" from="0 120 160" to="360 120 160" dur="20s" repeatCount="indefinite"/>
    </circle>
    <!-- Badge Disc -->
    <circle cx="120" cy="160" r="42" fill="#16a34a"/>
    <circle cx="120" cy="160" r="42" fill="none" stroke="#a7f3d0" stroke-opacity=".6" stroke-width="1.5"/>
    <circle cx="120" cy="160" r="38" fill="none" stroke="#ffffff" stroke-opacity=".1" stroke-width="1"/>
    <!-- Gloss -->
    <ellipse cx="112" cy="138" rx="28" ry="14" fill="#ffffff" opacity=".15"/>
    <!-- WhatsApp Icon -->
    <g transform="translate(100 142) scale(1.7)">
      <path fill="#ffffff" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
    </g>
    <!-- Pulse Ring -->
    <circle cx="120" cy="160" r="42" fill="none" stroke="#4ade80" stroke-width="2" opacity=".8">
      <animate attributeName="r" values="42;65" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".8;0" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ══════════ CENTRAL TYPOGRAPHY ══════════ -->
  <!-- Top Eyebrow -->
  <line x1="180" y1="52" x2="280" y2="52" stroke="#22d3ee" stroke-opacity=".5" stroke-width="1.5"/>
  <line x1="620" y1="52" x2="720" y2="52" stroke="#22d3ee" stroke-opacity=".5" stroke-width="1.5"/>
  <text x="450" y="58" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="8" fill="#7dd3fc">WHATSAPP MULTI-DEVICE BOT</text>

  <!-- Main Title -->
  <text x="450" y="172" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="130" font-weight="900" letter-spacing="12" fill="url(#titleGrad)" filter="url(#textGlow)" opacity=".4">AL-JIN</text>
  <text x="450" y="172" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="130" font-weight="900" letter-spacing="12" fill="url(#titleGrad)" stroke="#04091a" stroke-width="2" paint-order="stroke">AL-JIN</text>
  <text x="450" y="172" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="130" font-weight="900" letter-spacing="12" fill="url(#shineGrad)">AL-JIN</text>

  <!-- Divider -->
  <rect x="280" y="198" width="340" height="2" rx="1" fill="#ffffff" fill-opacity=".15"/>
  <rect x="280" y="198" width="120" height="2" rx="1" fill="url(#titleGrad)">
    <animate attributeName="x" values="280;620;280" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Subtitle -->
  <text x="450" y="230" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="600" fill="#eaf4ff" letter-spacing="1">Self-hosted  •  Open source  •  Baileys v7  •  Free AI</text>

  <!-- ══════════ BOTTOM PILLS ══════════ -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" text-anchor="middle">
    <!-- Pill 1: Commands -->
    <g>
      <rect x="195" y="255" width="135" height="30" rx="15" fill="#22d3ee" fill-opacity=".1" stroke="#22d3ee" stroke-opacity=".4" stroke-width="1"/>
      <circle cx="212" cy="270" r="2.5" fill="#22d3ee"><animate attributeName="opacity" values=".3;1;.3" dur="3s" repeatCount="indefinite"/></circle>
      <text x="275" y="274" fill="#cffafe">~400 Commands</text>
    </g>
    <!-- Pill 2: Free AI -->
    <g>
      <rect x="340" y="255" width="95" height="30" rx="15" fill="#a855f7" fill-opacity=".1" stroke="#a855f7" stroke-opacity=".4" stroke-width="1"/>
      <circle cx="357" cy="270" r="2.5" fill="#c084fc"><animate attributeName="opacity" values=".3;1;.3" dur="3s" begin="0.8s" repeatCount="indefinite"/></circle>
      <text x="395" y="274" fill="#f3e8ff">Free AI</text>
    </g>
    <!-- Pill 3: Anti-Delete -->
    <g>
      <rect x="445" y="255" width="120" height="30" rx="15" fill="#34d399" fill-opacity=".1" stroke="#34d399" stroke-opacity=".4" stroke-width="1"/>
      <circle cx="462" cy="270" r="2.5" fill="#34d399"><animate attributeName="opacity" values=".3;1;.3" dur="3s" begin="1.6s" repeatCount="indefinite"/></circle>
      <text x="515" y="274" fill="#d1fae5">Anti-Delete</text>
    </g>
    <!-- Pill 4: Author -->
    <g>
      <rect x="575" y="255" width="145" height="30" rx="15" fill="#f59e0b" fill-opacity=".15" stroke="#f59e0b" stroke-opacity=".6" stroke-width="1"/>
      <path d="M592 264 L594 268 L598 270 L594 272 L592 276 L590 272 L586 270 L590 268 Z" fill="#fbbf24">
        <animate attributeName="opacity" values=".5;1;.5" dur="3s" begin="2.4s" repeatCount="indefinite"/>
      </path>
      <text x="655" y="274" fill="#fef3c7" font-weight="700" letter-spacing="0.5">by Malik Mehab</text>
    </g>
  </g>

  <!-- ══════════ FOREGROUND VIGNETTE & GLASS ══════════ -->
  <rect width="900" height="320" fill="url(#vignette)" opacity=".8"/>
  <rect x="2" y="2" width="896" height="100" fill="url(#glassTop)"/>

</g>

<!-- ══════════ ANIMATED BORDER ══════════ -->
<rect x="2" y="2" width="896" height="316" rx="24" fill="none" stroke="url(#titleGrad)" stroke-width="2.5" opacity=".9"/>
<rect x="6" y="6" width="888" height="308" rx="20" fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="1"/>
</svg>
