<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-labelledby="t d">
<title id="t">Al-Jin WhatsApp Bot</title>
<desc id="d">Al-Jin: self-hosted, open-source WhatsApp Multi-Device bot built on Node.js and Baileys v7, with free AI and 300+ commands.</desc>
<defs>
