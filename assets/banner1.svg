<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-labelledby="t d">
<title id="t">Al-Jin WhatsApp Bot</title>
<desc id="d">Al-Jin: self-hosted, open-source WhatsApp Multi-Device bot built on Node.js and Baileys v7, with free AI and 300+ commands.</desc>

<defs>
  <!-- ── Background ─────────────────────────────────────── -->
  <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="320">
    <stop offset="0"   stop-color="#04050f"/>
    <stop offset=".35" stop-color="#0a0a2b"/>
    <stop offset=".7"  stop-color="#0e1140"/>
    <stop offset="1"   stop-color="#061e33"/>
  </linearGradient>

  <!-- ── Title gradient (seamless loop) ─────────────────── -->
  <linearGradient id="tg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0" spreadMethod="repeat">
    <stop offset="0"   stop-color="#22d3ee"/>
    <stop offset=".25" stop-color="#818cf8"/>
    <stop offset=".5"  stop-color="#c084fc"/>
    <stop offset=".75" stop-color="#34d399"/>
    <stop offset="1"   stop-color="#22d3ee"/>
    <animateTransform attributeName="gradientTransform" type="translate"
                      from="0 0" to="600 0" dur="9s" repeatCount="indefinite"/>
  </linearGradient>

  <!-- ── Border gradient (seamless loop) ────────────────── -->
  <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0" spreadMethod="repeat">
    <stop offset="0"   stop-color="#22d3ee"/>
    <stop offset=".33" stop-color="#a78bfa"/>
    <stop offset=".66" stop-color="#34d399"/>
    <stop offset="1"   stop-color="#22d3ee"/>
    <animateTransform attributeName="gradientTransform" type="translate"
                      from="0 0" to="900 0" dur="14s" repeatCount="indefinite"/>
  </linearGradient>

  <!-- ── Title shine sweep ──────────────────────────────── -->
  <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="-160" y1="0" x2="160" y2="0">
    <stop offset="0"   stop-color="#ffffff" stop-opacity="0"/>
    <stop offset=".5"  stop-color="#ffffff" stop-opacity=".9"/>
    <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
    <animateTransform attributeName="gradientTransform" type="translate"
                      values="-100 0;1000 0;1000 0" keyTimes="0;0.35;1"
                      dur="7s" repeatCount="indefinite"/>
  </linearGradient>

  <!-- ── Aurora blobs ───────────────────────────────────── -->
  <radialGradient id="o1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".55"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <radialGradient id="o2"><stop offset="0" stop-color="#a855f7" stop-opacity=".50"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
  <radialGradient id="o3"><stop offset="0" stop-color="#34d399" stop-opacity=".38"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
  <radialGradient id="o4"><stop offset="0" stop-color="#60a5fa" stop-opacity=".42"/><stop offset="1" stop-color="#60a5fa" stop-opacity="0"/></radialGradient>

  <!-- ── Title halo ─────────────────────────────────────── -->
  <radialGradient id="halo">
    <stop offset="0"   stop-color="#7dd3fc" stop-opacity=".40"/>
    <stop offset=".55" stop-color="#818cf8" stop-opacity=".13"/>
    <stop offset="1"   stop-color="#818cf8" stop-opacity="0"/>
  </radialGradient>

  <!-- ── Edge vignette ──────────────────────────────────── -->
  <radialGradient id="vig" gradientUnits="userSpaceOnUse" cx="450" cy="160" r="520">
    <stop offset=".55" stop-color="#000" stop-opacity="0"/>
    <stop offset="1"   stop-color="#000" stop-opacity=".55"/>
  </radialGradient>

  <!-- ── Glass top highlight ────────────────────────────── -->
  <linearGradient id="glass" gradientUnits="userSpaceOnUse" x1="0" y1="2" x2="0" y2="96">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".10"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>

  <!-- ── Eyebrow side fades ─────────────────────────────── -->
  <linearGradient id="fadeL" gradientUnits="userSpaceOnUse" x1="130" y1="0" x2="238" y2="0">
    <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity=".7"/>
  </linearGradient>
  <linearGradient id="fadeR" gradientUnits="userSpaceOnUse" x1="662" y1="0" x2="770" y2="0">
    <stop offset="0" stop-color="#22d3ee" stop-opacity=".7"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </linearGradient>

  <!-- ── Grid + filters + clips ─────────────────────────── -->
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M36 0H0V36" fill="none" stroke="#7dd3fc" stroke-opacity=".06" stroke-width="1"/>
  </pattern>

  <filter id="blur" x="-40%" y="-80%" width="180%" height="260%">
    <feGaussianBlur stdDeviation="11"/>
  </filter>
  <filter id="glow" x="-40%" y="-80%" width="180%" height="260%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <clipPath id="clip"><rect x="2" y="2" width="896" height="316" rx="26"/></clipPath>
  <clipPath id="barClip"><rect x="250" y="193" width="400" height="3" rx="1.5"/></clipPath>
</defs>

<g clip-path="url(#clip)">

  <!-- ══ BACKDROP ══ -->
  <rect width="900" height="320" fill="url(#bg)"/>
  <rect width="900" height="320" fill="url(#grid)"/>

  <!-- ══ AURORA ══ -->
  <ellipse cx="150" cy="60" rx="230" ry="160" fill="url(#o1)">
    <animate attributeName="cx" values="150;225;150" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="60;35;60" dur="13s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="760" cy="250" rx="250" ry="170" fill="url(#o2)">
    <animate attributeName="cx" values="760;665;760" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="250;278;250" dur="9s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="450" cy="330" rx="300" ry="100" fill="url(#o3)">
    <animate attributeName="cy" values="330;295;330" dur="8s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="640" cy="30" rx="220" ry="120" fill="url(#o4)">
    <animate attributeName="cx" values="640;700;640" dur="15s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ══ STARFIELD ══ -->
  <g fill="#cfe9ff">
    <circle cx="428" cy="42"  r="1"><animate attributeName="opacity" values=".12;.95;.12" dur="4.5s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="47"  r="1.2"><animate attributeName="opacity" values=".12;.95;.12" dur="2.3s" begin="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="95"  cy="141" r="1"><animate attributeName="opacity" values=".12;.95;.12" dur="3.7s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="252" cy="49"  r="2"><animate attributeName="opacity" values=".12;.95;.12" dur="2.3s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="232" r="1.2"><animate attributeName="opacity" values=".12;.95;.12" dur="3.7s" begin="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="129" cy="114" r="1.6"><animate attributeName="opacity" values=".12;.95;.12" dur="2.5s" begin="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="601" cy="48"  r="1.2"><animate attributeName="opacity" values=".12;.95;.12" dur="3.6s" begin="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="819" cy="178" r="2"><animate attributeName="opacity" values=".12;.95;.12" dur="3.8s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="837" cy="110" r="1.2"><animate attributeName="opacity" values=".12;.95;.12" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="770" cy="247" r="1.6"><animate attributeName="opacity" values=".12;.95;.12" dur="3.9s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="548" cy="232" r="1.2"><animate attributeName="opacity" values=".12;.95;.12" dur="4.3s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="632" cy="272" r="2"><animate attributeName="opacity" values=".12;.95;.12" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="379" cy="29"  r="2"><animate attributeName="opacity" values=".12;.95;.12" dur="3.2s" begin="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="529" cy="48"  r="1.2"><animate attributeName="opacity" values=".12;.95;.12" dur="4.4s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="277" cy="221" r="2"><animate attributeName="opacity" values=".12;.95;.12" dur="4.8s" begin="2.0s" repeatCount="indefinite"/></circle>
    <circle cx="194" cy="247" r="2"><animate attributeName="opacity" values=".12;.95;.12" dur="3.7s" begin="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="862" cy="238" r="1.6"><animate attributeName="opacity" values=".12;.95;.12" dur="4.2s" begin="3.9s" repeatCount="indefinite"/></circle>
    <circle cx="723" cy="212" r="1.2"><animate attributeName="opacity" values=".12;.95;.12" dur="2.6s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="36"  cy="266" r="1.2"><animate attributeName="opacity" values=".12;.95;.12" dur="2.9s" begin="0.1s" repeatCount="indefinite"/></circle>
    <circle cx="453" cy="291" r="1.6"><animate attributeName="opacity" values=".12;.95;.12" dur="3.9s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="218" r="2"><animate attributeName="opacity" values=".12;.95;.12" dur="3.3s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="90"  r="1.4"><animate attributeName="opacity" values=".12;.95;.12" dur="3.1s" begin="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="180" r="1.4"><animate attributeName="opacity" values=".12;.95;.12" dur="4.1s" begin="1.1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ══ DRIFTING MOTES ══ -->
  <g fill="#a5f3fc">
    <circle cx="120" cy="320" r="1.5" opacity="0"><animate attributeName="cy" values="320;-15" dur="13s" begin="0s"  repeatCount="indefinite"/><animate attributeName="opacity" values="0;.75;0" dur="13s" begin="0s"  repeatCount="indefinite"/></circle>
    <circle cx="245" cy="320" r="1.1" opacity="0"><animate attributeName="cy" values="320;-15" dur="17s" begin="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.6;0"  dur="17s" begin="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="355" cy="320" r="1.7" opacity="0"><animate attributeName="cy" values="320;-15" dur="15s" begin="6s"  repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0"  dur="15s" begin="6s"  repeatCount="indefinite"/></circle>
    <circle cx="505" cy="320" r="1.2" opacity="0"><animate attributeName="cy" values="320;-15" dur="19s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.55;0" dur="19s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="320" r="1.6" opacity="0"><animate attributeName="cy" values="320;-15" dur="14s" begin="8s"  repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0"  dur="14s" begin="8s"  repeatCount="indefinite"/></circle>
    <circle cx="742" cy="320" r="1.1" opacity="0"><animate attributeName="cy" values="320;-15" dur="18s" begin="4.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.5;0"  dur="18s" begin="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="838" cy="320" r="1.4" opacity="0"><animate attributeName="cy" values="320;-15" dur="16s" begin="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.65;0" dur="16s" begin="10s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ══ GENIE WISP — a comet with a fading trail ══ -->
  <g>
    <circle r="4.5" fill="url(#o1)"/>
    <circle r="2.6" fill="#e0f7ff">
      <animateMotion dur="16s" repeatCount="indefinite" path="M-80 170 C 140 60 260 260 470 150 S 740 40 980 180"/>
    </circle>
    <animateMotion dur="16s" repeatCount="indefinite" path="M-80 170 C 140 60 260 260 470 150 S 740 40 980 180"/>
  </g>
  <circle r="2.0" fill="#67e8f9" opacity=".55">
    <animateMotion dur="16s" begin="-0.25s" repeatCount="indefinite" path="M-80 170 C 140 60 260 260 470 150 S 740 40 980 180"/>
  </circle>
  <circle r="1.5" fill="#67e8f9" opacity=".32">
    <animateMotion dur="16s" begin="-0.5s" repeatCount="indefinite" path="M-80 170 C 140 60 260 260 470 150 S 740 40 980 180"/>
  </circle>
  <circle r="1.1" fill="#a5f3fc" opacity=".18">
    <animateMotion dur="16s" begin="-0.75s" repeatCount="indefinite" path="M-80 170 C 140 60 260 260 470 150 S 740 40 980 180"/>
  </circle>

  <!-- ══ TITLE HALO ══ -->
  <ellipse cx="450" cy="148" rx="370" ry="122" fill="url(#halo)">
    <animate attributeName="rx" values="370;392;370" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".85;1;.85" dur="7s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ══ EYEBROW ══ -->
  <line x1="130" y1="53" x2="238" y2="53" stroke="url(#fadeL)" stroke-width="1.2"/>
  <line x1="662" y1="53" x2="770" y2="53" stroke="url(#fadeR)" stroke-width="1.2"/>
  <circle cx="238" cy="53" r="2" fill="#22d3ee"><animate attributeName="opacity" values=".4;1;.4" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="662" cy="53" r="2" fill="#22d3ee"><animate attributeName="opacity" values=".4;1;.4" dur="3s" begin="1.5s" repeatCount="indefinite"/></circle>

  <text x="450" y="59" text-anchor="middle"
        font-family="'Segoe UI','Helvetica Neue',Arial,'DejaVu Sans',sans-serif"
        font-size="15.5" font-weight="700" letter-spacing="6.5" fill="#7dd3fc">WHATSAPP  ·  MULTI-DEVICE  ·  BOT</text>

  <!-- ══ TITLE ══ -->
  <text x="450" y="170" text-anchor="middle"
        font-family="'Segoe UI','Helvetica Neue',Arial,'DejaVu Sans',sans-serif"
        font-size="118" font-weight="800" letter-spacing="10"
        fill="url(#tg)" opacity=".55" filter="url(#blur)">AL-JIN</text>

  <text x="450" y="170" text-anchor="middle"
        font-family="'Segoe UI','Helvetica Neue',Arial,'DejaVu Sans',sans-serif"
        font-size="118" font-weight="800" letter-spacing="10"
        fill="url(#tg)" stroke="#04091a" stroke-width="1.4" paint-order="stroke">AL-JIN</text>

  <text x="450" y="170" text-anchor="middle"
        font-family="'Segoe UI','Helvetica Neue',Arial,'DejaVu Sans',sans-serif"
        font-size="118" font-weight="800" letter-spacing="10"
        fill="url(#shine)">AL-JIN</text>

  <!-- ══ DIVIDER + SWEEP ══ -->
  <g clip-path="url(#barClip)">
    <rect x="250" y="193" width="400" height="3" rx="1.5" fill="#ffffff" fill-opacity=".13"/>
    <rect y="193" width="150" height="3" rx="1.5" fill="url(#edge)">
      <animate attributeName="x" values="-150;1020" dur="4.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ══ SUBTITLE ══ -->
  <text x="450" y="232" text-anchor="middle"
        font-family="'Segoe UI','Helvetica Neue',Arial,'DejaVu Sans',sans-serif"
        font-size="22" font-weight="600" fill="#eaf4ff">Self-hosted  •  Open source  •  Baileys v7  •  Free AI</text>

  <!-- ══ FEATURE PILLS ══ -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,'DejaVu Sans',sans-serif"
     font-size="14.5" font-weight="600" text-anchor="middle">

    <g>
      <rect x="182.5" y="252" width="146" height="32" rx="16" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-opacity=".35" stroke-width="1"/>
      <circle cx="203" cy="268" r="2.6" fill="#22d3ee"><animate attributeName="opacity" values=".35;1;.35" dur="3.2s" repeatCount="indefinite"/></circle>
      <text x="262" y="273" fill="#cffafe">300+ Commands</text>
    </g>

    <g>
      <rect x="342.5" y="252" width="96" height="32" rx="16" fill="#a855f7" fill-opacity=".08" stroke="#a855f7" stroke-opacity=".35" stroke-width="1"/>
      <circle cx="363" cy="268" r="2.6" fill="#c084fc"><animate attributeName="opacity" values=".35;1;.35" dur="3.2s" begin="0.8s" repeatCount="indefinite"/></circle>
      <text x="398" y="273" fill="#f3e8ff">Free AI</text>
    </g>

    <g>
      <rect x="452.5" y="252" width="130" height="32" rx="16" fill="#34d399" fill-opacity=".08" stroke="#34d399" stroke-opacity=".35" stroke-width="1"/>
      <circle cx="473" cy="268" r="2.6" fill="#34d399"><animate attributeName="opacity" values=".35;1;.35" dur="3.2s" begin="1.6s" repeatCount="indefinite"/></circle>
      <text x="525" y="273" fill="#d1fae5">Anti-Delete</text>
    </g>

    <g>
      <rect x="596.5" y="252" width="121" height="32" rx="16" fill="#60a5fa" fill-opacity=".08" stroke="#60a5fa" stroke-opacity=".35" stroke-width="1"/>
      <circle cx="617" cy="268" r="2.6" fill="#93c5fd"><animate attributeName="opacity" values=".35;1;.35" dur="3.2s" begin="2.4s" repeatCount="indefinite"/></circle>
      <text x="664" y="273" fill="#dbeafe">Baileys v7</text>
    </g>
  </g>

  <!-- ══ VIGNETTE + GLASS ══ -->
  <rect width="900" height="320" fill="url(#vig)" opacity=".7"/>
  <rect x="2" y="2" width="896" height="94" fill="url(#glass)"/>
</g>

<!-- ══ ANIMATED BORDER ══ -->
<rect x="2" y="2" width="896" height="316" rx="26" fill="none" stroke="url(#edge)" stroke-width="2.2"/>
<rect x="6.5" y="6.5" width="887" height="307" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
</svg>
