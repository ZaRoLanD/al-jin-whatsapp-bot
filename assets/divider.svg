<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 24" width="800" height="24" role="img" aria-label="divider">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox" spreadMethod="reflect">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset=".3" stop-color="#00f0ff"/>
      <stop offset=".7" stop-color="#00ff88"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
      <animate attributeName="x1" values="-1;0;-1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1;0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="f" x="-10%" y="-300%" width="120%" height="700%"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>
  <rect x="40" y="10" width="720" height="3" rx="1.5" fill="url(#g)" filter="url(#f)" opacity=".8"/>
  <rect x="40" y="10" width="720" height="2" rx="1" fill="url(#g)"/>
  <circle cx="400" cy="11" r="4" fill="#00f0ff"><animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.4;1" dur="2s" repeatCount="indefinite"/></circle>
</svg>
